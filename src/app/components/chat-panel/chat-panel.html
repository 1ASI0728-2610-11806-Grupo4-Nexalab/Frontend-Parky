<div class="chat-container" [class.collapsed]="isCollapsed">
  <div class="chat-header" (click)="toggleCollapse()">
    <div class="header-info" *ngIf="activeChat()">
      <img [src]="activeChat()?.participant?.avatarUrl" alt="Participant" class="avatar">
      <div class="user-details">
        <h4>{{ activeChat()?.participant?.name }}</h4>
        <p *ngIf="mode === 'conductor'">Propietario</p>
        <p *ngIf="mode === 'propietario'">Conductor (Reserva Activa)</p>
      </div>
    </div>
    
    <button class="collapse-btn">
      <span class="material-symbols-outlined">{{ isCollapsed ? 'keyboard_arrow_up' : 'keyboard_arrow_down' }}</span>
    </button>
  </div>

  <div class="chat-body" *ngIf="!isCollapsed && activeChat()">
    
    <ng-container *ngFor="let msg of activeChat()?.messages">
      <div *ngIf="msg.isAiGenerated" class="ai-generated-label">✨ RESPUESTA GENERADA POR IA</div>
      <div class="message" [class.outgoing]="msg.senderId === dataService.currentUser()?.id" [class.incoming]="msg.senderId !== dataService.currentUser()?.id">
        <img *ngIf="msg.senderId !== dataService.currentUser()?.id" [src]="activeChat()?.participant?.avatarUrl" alt="Them" class="msg-avatar">
        <div class="bubble">{{ msg.text }}</div>
        <img *ngIf="msg.senderId === dataService.currentUser()?.id" [src]="dataService.currentUser()?.avatarUrl" alt="Me" class="msg-avatar">
      </div>
    </ng-container>

  </div>

  <div class="chat-footer" *ngIf="!isCollapsed">
    <div class="input-area">
      <input type="text" [(ngModel)]="message" (keyup.enter)="sendMessage()" placeholder="Escribe un mensaje..." class="chat-input">
      <button class="send-btn" [class.active]="message.length > 0" (click)="sendMessage()">
        <span class="material-symbols-outlined">send</span>
      </button>
    </div>
  </div>
</div>
